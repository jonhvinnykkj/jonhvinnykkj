  <line x1="0" y1="210" x2="1200" y2="210" stroke="url(#fio)" stroke-width="1.2"/>

  <rect x="0" y="286" width="1200" height="34" fill="url(#vinheta)"/>

  <!-- === IDENTIFICAÇÃO === -->
  <text class="mono" x="72" y="72" fill="#7C8F84" font-size="12.5" letter-spacing="4.2">SISTEMAS INTERNOS · AGRONEGÓCIO</text>

  <text class="mono" x="70" y="140" fill="#E9E4D6" font-size="62" font-weight="700" letter-spacing="-1.5">vinnycius</text>

  <text class="sans" x="72" y="174" fill="#7C8F84" font-size="16.5">Do controle de balança na fazenda ao dashboard que a diretoria abre de manhã.</text>

  <!-- === LEITURA === alinhada à direita, como painel de instrumento -->
  <g class="mono" text-anchor="end">
    <text x="1128" y="66" fill="#7C8F84" font-size="11" letter-spacing="2.6">EM PRODUÇÃO</text>
    <text x="1128" y="104" fill="#E3B04B" font-size="34" font-weight="700" letter-spacing="-0.5">08</text>
