<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="vinnycius — sistemas internos para o agronegócio">
  <title>vinnycius — sistemas internos para o agronegócio</title>

  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101C17"/>
      <stop offset="100%" stop-color="#0A1210"/>
    </linearGradient>

    <!-- lavoura some perto do horizonte: dá a profundidade -->
    <linearGradient id="profundidade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="42%" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="80%" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="mascaraCampo">
      <rect x="0" y="210" width="1200" height="110" fill="url(#profundidade)"/>
    </mask>

    <!-- brilho do horizonte, mais forte sobre o ponto de fuga -->
    <radialGradient id="brilho" cx="68.33333333333333%" cy="100%" r="44%">
      <stop offset="0%" stop-color="#2E6B4F" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#2E6B4F" stop-opacity="0"/>
    </radialGradient>

    <!-- fio do horizonte: some nas bordas -->
    <linearGradient id="fio" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#8FD694" stop-opacity="0"/>
      <stop offset="16%" stop-color="#8FD694" stop-opacity="0.9"/>
      <stop offset="84%" stop-color="#8FD694" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8FD694" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="vinheta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1210" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A1210" stop-opacity="0.55"/>
    </linearGradient>

    <!-- varredura de luz sobre a lavoura -->
    <linearGradient id="luz" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8FD694" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8FD694" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8FD694" stop-opacity="0"/>
    </linearGradient>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
      .varredura { animation: passa 19s linear infinite; }
      @keyframes passa {
        from { transform: translateX(-620px); }
        to   { transform: translateX(1420px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .varredura { animation: none; opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#ceu)"/>
  <rect x="0" y="90" width="1200" height="230" fill="url(#brilho)"/>

  <!-- === LAVOURA === -->
