# Redesenha o painel de projetos com os dados atuais dos repositorios.
#
# Comita direto em assets/ na main, em vez de publicar numa branch separada:
# assim o README referencia caminho relativo e nunca fica com imagem quebrada.
name: Painel de projetos

on:
  schedule:
    - cron: '0 6 * * *'      # toda manha, 06:00 UTC
  workflow_dispatch:          # e sob demanda pelo botao Run workflow
  push:
    branches: [main]
    paths: ['scripts/gen-projetos.cjs', '.github/workflows/projetos.yml']

permissions:
  contents: write

concurrency:
  group: painel-projetos
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerar SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gen-projetos.cjs assets

      - name: Comitar se mudou
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/projetos-dark.svg assets/projetos-light.svg
          git diff --staged --quiet && echo 'nada mudou' && exit 0
          git commit -m 'chore: atualiza o painel de projetos [skip ci]'
          git push
